name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (py${{ matrix.python-version }})
    # Same commands as local development, inside the same dev image.
    runs-on: ubuntu-latest
    strategy:
      # Let every version finish, so one failure shows all the versions that fail.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Build the dev image with layer caching, tagged as compose names it
      # (<directory>-app) so `./dev.sh check` finds it and does not rebuild.
      # The cache key is the layers themselves, so changing the Dockerfile or
      # requirements*.txt invalidates exactly the layers that depend on them.
      - name: Read runner UID and GID
        id: ids
        run: |
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"

      - name: Build dev image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: dev
          build-args: |
            UID=${{ steps.ids.outputs.uid }}
            GID=${{ steps.ids.outputs.gid }}
            PYTHON_IMAGE=python:${{ matrix.python-version }}-slim
          tags: ${{ github.event.repository.name }}-app
          load: true
          cache-from: type=gha,scope=dev-py${{ matrix.python-version }}
          cache-to: type=gha,scope=dev-py${{ matrix.python-version }},mode=max

      - name: Check generated code, lint, typecheck, test, check migrations
        run: ./dev.sh check

      - name: Tear down
        if: always()
        run: ./dev.sh down

  image:
    # Only meaningful once `./dev.sh init` has produced app/; the template repo skips it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build production image
        if: hashFiles('app/main.py') != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          target: prod
          tags: ${{ github.event.repository.name }}:${{ github.sha }}
          cache-from: type=gha,scope=prod
          cache-to: type=gha,scope=prod,mode=max

      - name: Build job runner image
        if: hashFiles('app/worker.py') != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          target: jobs
          tags: ${{ github.event.repository.name }}-jobs:${{ github.sha }}
          cache-from: type=gha,scope=jobs
          cache-to: type=gha,scope=jobs,mode=max

      # The Lambda variant is optional: a service without requirements-lambda.txt skips it.
      - name: Build job runner Lambda image
        if: hashFiles('app/worker.py') != '' && hashFiles('requirements-lambda.txt') != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          target: jobs-lambda
          tags: ${{ github.event.repository.name }}-jobs-lambda:${{ github.sha }}
          cache-from: type=gha,scope=jobs-lambda
          cache-to: type=gha,scope=jobs-lambda,mode=max
